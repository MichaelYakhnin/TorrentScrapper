version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: torrent-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    expose:
      - "8080"
    networks:
      - ts-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: torrent-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ts-net

networks:
  ts-net:
    driver: bridge
